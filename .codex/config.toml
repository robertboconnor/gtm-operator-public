approval_policy = "on-request"
sandbox_mode = "danger-full-access"
[mcp_servers.hubspot-operator]
args = ["./plugins/hubspot-operator/dist/server.js"]
command = "node"

[mcp_servers.hubspot-operator.tools."crm.search"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."workflows.search"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."workflows.get"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."lists.search"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."lists.get"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."lists.members.list"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."segments.get"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."workflows.clone_basic"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."segments.search"]
approval_mode = "approve"

# Every HubSpot tool that changes something in a live portal stops for a human.
[mcp_servers.hubspot-operator.tools."workflows.delete"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."workflows.set_enabled"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."workflows.rename"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."workflows.create_manual"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."workflows.add_go_to_workflow_step"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."workflows.add_email_branch"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."crm.update_properties"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."users.create"]
approval_mode = "approve"

[mcp_servers.hubspot-operator.tools."users.update"]
approval_mode = "approve"

[mcp_servers.outreach-operator]
args = ["./plugins/outreach-operator/dist/server.js"]
command = "node"

# Mutations only. Reads (outreach.search / outreach.get / outreach.whoami /
# outreach.custom_fields) run without a prompt; anything that writes to a real
# Outreach org stops for a human first.
[mcp_servers.outreach-operator.tools."outreach.create"]
approval_mode = "approve"

[mcp_servers.outreach-operator.tools."outreach.update"]
approval_mode = "approve"

[mcp_servers.outreach-operator.tools."outreach.delete"]
approval_mode = "approve"

[mcp_servers.outreach-operator.tools."sequences.enroll_prospect"]
approval_mode = "approve"

[mcp_servers.salesforce-sobject-all]
command = "npx"
args = [
  "-y",
  "mcp-remote@0.1.37",
  "https://api.salesforce.com/platform/mcp/v1/platform/sobject-all",
  "8080",
  "--static-oauth-client-info",
  "{\"client_id\":\"YOUR_SALESFORCE_CONNECTED_APP_CLIENT_ID\",\"client_secret\":\"\"}"
]

[mcp_servers.salesforce-sobject-all.tools.updateSobjectRecord]
approval_mode = "approve"

